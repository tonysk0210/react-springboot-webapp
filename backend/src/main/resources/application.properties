spring.application.name=backend
################ 預設的 Spring Profiles 激活模式 (理想上可在 Environment 中設定) ################
spring.profiles.active=default
################ Log 相關設定 ################
# console 的日志输出格式 顏色
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
# 如果有設定 LOG_LEVEL 環境變數，則使用該值作為 root logger 的日志級別；如果沒有設定，則預設為 INFO 級別
# logging.level.root 可以被 externalized 使用環境變數覆蓋 env: LOGGING_LEVEL_ROOT=DEBUG
logging.level.root=${LOG_LEVEL:INFO}
# 如果有設定 LOG_FILE_NAME 環境變數，則使用該值作為日志文件的名稱；如果沒有設定，則預設為 ./logs/app.log
logging.file.name=${LOG_FILE_NAME:./logs/app.log}
# 變成「類 JSON 格式」的日志輸出格式，包含 timestamp、level、logger 和 message 四個字段
#logging.pattern.file={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","logger":"%c","message":"%m"}%n
################ H2 Database 相關設定 ################
# 使用 H2 Database 的 JDBC 驅動
spring.datasource.driver-class-name=org.h2.Driver
# 允許使用 H2 Console; default: http://localhost:8080/h2-console
spring.h2.console.enabled=true
# H2 Database 的連接 URL; 這裡使用 file 模式，數據將保存在當前目錄下的 h2db/myDb 文件中; AUTO_SERVER=true 允許多個應用程序同時訪問該數據庫
spring.datasource.url=jdbc:h2:file:./h2db/myDb;AUTO_SERVER=true
# H2 Database 的驅動類名稱; 這裡使用 org.h2.Driver 作為 H2 Database 的 JDBC 驅動 (Optional)
spring.datasource.username=sa
spring.datasource.password=
# schema.sql 和 data.sql 的位置; 這裡使用 classpath:sql/schema.sql 和 classpath:sql/data.sql 作為 SQL 初始化腳本的位置 optional: 表示如果文件不存在則不會報錯
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.data-locations=classpath:sql/data.sql
# 指定 SQL 初始化模式為 embedded，表示只有在使用嵌入式數據庫（如 H2）時才會執行 SQL 初始化腳本
# schema.sql / data.sql 的初始化，預設不一定會對 file DB 執行，所以需要明確指定 always 模式
spring.sql.init.mode=always
# 方言（dialect）不需明確指定：Hibernate 7 會依 JDBC 連線自動判斷。
# 明確設定會觸發 HHH90000025 deprecation 警告，故移除。
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 啟動時驗證 Entity 與實際資料表是否相符（欄位缺失／型別不符 → 直接啟動失敗）。
spring.jpa.hibernate.ddl-auto=validate
# 顯示 SQL 語句; 這裡設置為 true，表示在控制台輸出執行的 SQL 語句 (can be externalized spring_jpa_show_sql=true 環境變數)
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
# 讓 Hibernate 印出的 SQL 變好讀（有換行 + 縮排）
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
################ Actuator 相關設定 ################
# /actuator/health 要不要顯示「詳細資訊」
management.endpoint.health.show-details=always
# 所有 Actuator 監控 API 的「共同前綴路徑」/actuator
management.endpoints.web.base-path=/actuator
# 把所有 Actuator endpoint 全部「對外開放」
management.endpoints.web.exposure.include=*
# 把 beans 和 health 這兩個 Actuator endpoint「對外關閉」
#management.endpoints.web.exposure.exclude=beans, health
# /actuator/configprops 要不要把「設定的值」顯示出來
management.endpoint.configprops.show-values=always
# /actuator/env 要不要把「環境變數的值」顯示出來
management.endpoint.env.show-values=always
# 是否把「環境變數（env）」資訊加入到 /actuator/info 裡面
management.info.env.enabled=true
# spring.application.name 的值，複製到 /actuator/info 裡面
info.app.name=${spring.application.name}
info.app.description=Backend Project for reactSpringBoot
info.app.version=1.0.0
info.app.contact.name=anthonyshangkuan@gmail.com
