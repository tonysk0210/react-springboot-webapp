logging.level.root=${LOG_LEVEL:ERROR}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:stickerstore}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
# 方言由 Hibernate 7 依 JDBC 連線自動判斷，明確指定會觸發 HHH90000025 deprecation 警告
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
spring.sql.init.mode=never
# 生產環境關閉 API 文件端點（springdoc 3 預設開啟，啟動時會發出警告）
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
contact.phone=9876543210
contact.email=prod@gmail.com
contact.address=Canada
